<script>
(() => {
  const P = new URLSearchParams(location.search);
  const PNG = P.has('png');
  document.body.classList.toggle('png', PNG);
  document.body.classList.toggle('xem', P.has('xem'));
  const $ = (id) => document.getElementById(id);
  // Co gian khung 1080x1920 cho vua cua so (giu ti le 9:16, can giua). Cua so ~1080x1920 (sai lech <= 2px) thi giu ti le 1.
  const kv = $('kv');
  const vua = () => {
    const w = innerWidth || 1080, h = innerHeight || 1920;
    const gan = Math.abs(w - 1080) <= 2 && Math.abs(h - 1920) <= 2;
    const t = gan ? 1 : Math.min(w / 1080, h / 1920);
    kv.style.transform = t === 1 ? 'none' : 'scale(' + t + ')';
    kv.style.left = (gan ? 0 : (w - 1080 * t) / 2) + 'px';
    kv.style.top = (gan ? 0 : (h - 1920 * t) / 2) + 'px';
  };
  addEventListener('resize', vua); addEventListener('load', vua); vua();
  const MAC_DINH = {
    kenh: 'Phan Hiếu Stock',
    avatar: 'avatar.png',
    phuDe: ['Chứng khoán · CloudStock', 'Bấm THEO DÕI để không lỡ buổi live'],
    web: 'cloudstock.id.vn',
    tieuDe: 'NỘI DUNG HÔM NAY',
    muc: ['Nhận định thị trường hôm nay', 'Tín hiệu Mua – Bán trong ngày', 'Cách dùng bộ lọc chỉ báo', 'Giải đáp câu hỏi mọi người'],
    mayNoi: [
      'Chào cả nhà! Cùng Phan Hiếu Stock xem thị trường nhé!',
      'Nhớ bấm theo dõi Phan Hiếu Stock để không lỡ buổi live sau nha!',
      'Đầu tư có rủi ro, thông tin chỉ để tham khảo thôi nha!'
    ]
  };
  // Noi dung co the truyen qua link: khung-doc.html?c=<JSON da ma hoa> (trang chinh-noi-dung.html tao san link). Chi lay dung kieu du lieu.
  let tuUrl = {};
  try { const c = P.get('c'); if (c) tuUrl = JSON.parse(c) || {}; } catch (e) { tuUrl = {}; }
  const C = Object.assign({}, MAC_DINH, window.KHUNG_LIVE || {});
  for (const k of ['kenh', 'web', 'room', 'tieuDe']) if (typeof tuUrl[k] === 'string' && tuUrl[k].trim()) C[k] = tuUrl[k].slice(0, 80);
  // Avatar: chi nhan link https hoac ten file cung thu muc (khong nhan javascript: / data:).
  if (typeof tuUrl.avatar === 'string' && /^(https:\/\/[^\s"'<>]{4,300}|[\w.\-]{1,80})$/.test(tuUrl.avatar.trim())) C.avatar = tuUrl.avatar.trim();
  for (const k of ['phuDe', 'muc', 'mayNoi']) if (Array.isArray(tuUrl[k])) { const a = tuUrl[k].map((x) => String(x).trim().slice(0, 140)).filter(Boolean); if (a.length) C[k] = a; }
  // NOEL: loi chuc Giang sinh
  if (!C.phuDe.some((t) => /Giáng sinh/i.test(t))) C.phuDe = ['❄ Giáng sinh an lành ❄'].concat(C.phuDe).slice(0, 3);
  C.chay = C.chay.concat(['❄ Giáng sinh an lành! Chúc cả nhà một mùa Noel ấm áp, bình an và nhiều niềm vui ❄']);
  C.mayNoi = C.mayNoi.concat(['Giáng sinh an lành! Chúc cả nhà một mùa Noel thật ấm áp nha!']);
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // Chu co dinh
  $('kenh').textContent = C.kenh;
  // O avatar: chu cai dau cua 2 tu dau ten kenh (Phan Hieu Stock -> PH); co anh thi hien anh.
  $('avatar-chu').textContent = String(C.kenh).split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || 'PH';
  const avEl = $('avatar'), avAnh = $('avatar-anh');
  avAnh.onload = () => avEl.classList.add('co-anh');
  avAnh.onerror = () => avEl.classList.remove('co-anh');
  if (C.avatar) avAnh.src = C.avatar;
  $('web').textContent = C.web;
  $('mbs').textContent = (C.mbs || '7VZI');
  $('nd-tieu-de').textContent = C.tieuDe;
  $('phu-de').innerHTML = C.phuDe.slice(0, 3).map((t) => '<span>' + esc(t) + '</span>').join('');
  const homNay = new Date();
  const ngayVN = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric' }).format(homNay);
  const thuVN = new Intl.DateTimeFormat('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'long' }).format(homNay);
  $('ngaychip').textContent = thuVN + ' · ' + ngayVN;

  // O so buoc (1 2 3 4...): thu nho neu nhieu muc
  const muc = C.muc.slice(0, 6);
  const buocEl = $('buoc');
  buocEl.style.setProperty('--bk', (muc.length > 4 ? 32 : 36) + 'px');
  muc.forEach((_, i) => { const e = document.createElement('i'); e.textContent = String(i + 1); buocEl.appendChild(e); });
  const oBuoc = [...buocEl.children];
  const dat = (b) => oBuoc.forEach((e, i) => { e.classList.toggle('on', i === b); e.classList.toggle('xong', b >= 0 && i < b); });

  // May DOC NOI DUNG HOM NAY: cau chao -> "co N noi dung" -> tung noi dung -> cac loi nhan them, lap lai.
  const chuoi = [];
  if (C.mayNoi[0]) chuoi.push({ t: C.mayNoi[0], b: -1 });
  chuoi.push({ t: 'Hôm nay mình có ' + muc.length + ' nội dung nhé!', b: -1 });
  muc.forEach((t, i) => chuoi.push({ t: 'Nội dung ' + (i + 1) + ': ' + t, b: i }));
  C.mayNoi.slice(1).forEach((t) => chuoi.push({ t, b: -1 }));
  const bongNoi = $('bong-noi'), may = $('may'), bong = $('bong');
  // Cau dai thi chu nho lai cho vua bong noi.
  const coBong = (t) => { bongNoi.style.fontSize = (t.length <= 50 ? 27 : t.length <= 90 ? 24 : t.length <= 125 ? 21 : 19) + 'px'; };
  if (PNG) { coBong(chuoi[0].t); bongNoi.textContent = chuoi[0].t; dat(-1); } else {
    const chay = (i) => {
      const cau = chuoi[i % chuoi.length]; const t = cau.t; let k = 0; bongNoi.textContent = ''; coBong(t); dat(cau.b); may.classList.add('noi');
      bong.classList.remove('pop'); void bong.offsetWidth; bong.classList.add('pop');
      const tm = setInterval(() => { bongNoi.textContent = t.slice(0, ++k); if (k >= t.length) { clearInterval(tm); may.classList.remove('noi'); setTimeout(() => chay(i + 1), 3600); } }, 36);
    };
    chay(0);
  }

  // Dong ho + trang thai khung vao lenh (cung quy tac voi thanh dau cua web: khung 10:30-11:30 va 14:00-14:45)
  const KHUNG = [[630, 690], [840, 885]];
  function trangThai(d) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(d).map((x) => [x.type, x.value]));
    const gio = Number(p.hour) % 24, phut = Number(p.minute), giay = Number(p.second), m = gio * 60 + phut;
    const cuoiTuan = p.weekday === 'Sat' || p.weekday === 'Sun';
    const chuoiGio = String(gio).padStart(2, '0') + ':' + String(phut).padStart(2, '0') + ':' + String(giay).padStart(2, '0');
    if (cuoiTuan) return { chuoi: chuoiGio, nhan: 'Thị trường nghỉ', mau: '#C0C0CF', xanh: false };
    if (m < 540) return { chuoi: chuoiGio, nhan: 'Chưa mở phiên', mau: '#C0C0CF', xanh: false };
    if (KHUNG.some(([a, b]) => m >= a && m < b)) return { chuoi: chuoiGio, nhan: 'ĐANG TRONG KHUNG VÀO LỆNH', mau: '#22C55E', xanh: true };
    if (KHUNG.some(([a]) => m < a)) return { chuoi: chuoiGio, nhan: 'Ngoài khung vào lệnh', mau: '#FBBF24', xanh: false };
    return { chuoi: chuoiGio, nhan: 'Hết khung vào lệnh hôm nay', mau: '#C0C0CF', xanh: false };
  }
  const dh = $('dongho');
  const capNhat = () => { const t = trangThai(new Date()); $('gio').textContent = t.chuoi; const e = $('tt'); e.textContent = t.nhan; e.style.color = t.mau; dh.querySelector('svg').style.color = t.mau; dh.classList.toggle('xanh', t.xanh); };
  capNhat(); setInterval(capNhat, 1000);

  // Nen: duong bieu do troi + nen nhap nho (chi de trang tri) + hat bay
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 72; let y = 210; const diem = [];
  for (let i = 0; i <= N; i++) { y += (rnd() - 0.48) * 44; y = Math.max(60, Math.min(300, y)); diem.push(y); }
  diem[N] = diem[0];
  const buoc = 1080 / N, dd = [];
  for (let r = 0; r < 2; r++) for (let i = 0; i <= N; i++) dd.push([(r * N + i) * buoc, diem[i]]);
  const duong = 'M' + dd.map((q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
  $('bd-duong').setAttribute('d', duong);
  $('bd-vung').setAttribute('d', duong + ' L2160 340 L0 340 Z');
  let nenHtml = '', gia = 150;
  for (let i = 0; i < 36; i++) {
    const x = 6 + i * 30, tang = rnd() > 0.45, cao = 24 + rnd() * 90, day = 300 - gia;
    gia = Math.max(60, Math.min(200, gia + (rnd() - 0.5) * 36));
    const mau = tang ? '#22C55E' : '#EF4444';
    nenHtml += '<g class="nen-c" style="animation-duration:' + (2 + rnd() * 3).toFixed(1) + 's;animation-delay:-' + (rnd() * 4).toFixed(1) + 's"><rect x="' + (x + 6) + '" y="' + (day - cao - 14) + '" width="2" height="' + (cao + 28) + '" fill="' + mau + '"/><rect x="' + x + '" y="' + (day - cao) + '" width="14" height="' + cao + '" rx="2" fill="' + mau + '"/></g>';
  }
  $('nen-nen').innerHTML = nenHtml;
  const hat = $('hat');
  for (let i = 0; i < 18; i++) {
    const e = document.createElement('div'); e.className = 'hat';
    const kt = 4 + rnd() * 5;
    e.style.cssText = 'left:' + (rnd() * 1080).toFixed(0) + 'px;width:' + kt + 'px;height:' + kt + 'px;background:' + (rnd() > 0.75 ? '#22C55E' : rnd() > 0.5 ? '#FFFFFF' : '#FFD166') + ';animation-duration:' + (16 + rnd() * 18).toFixed(1) + 's;animation-delay:-' + (rnd() * 30).toFixed(1) + 's';
    if (PNG) { e.style.opacity = 0.35; e.style.bottom = (rnd() * 1800).toFixed(0) + 'px'; }
    hat.appendChild(e);
  }

  // Tim bay len tu goc duoi trai (moi ~1,6 giay)
  if (!PNG) {
    const ui = $('ui');
    setInterval(() => {
      const e = document.createElement('div'); e.className = 'tim';
      e.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 5.4 3.1 1.8-2 3.4-3.1 5.4-3.1 3.6 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';
      e.style.left = (60 + Math.random() * 300).toFixed(0) + 'px';
      e.style.setProperty('--dx', ((Math.random() - 0.5) * 70).toFixed(0) + 'px');
      e.style.setProperty('--rot', ((Math.random() - 0.5) * 50).toFixed(0) + 'deg');
      ui.appendChild(e); setTimeout(() => e.remove(), 3100);
    }, 1600);
  }
})();

<script>
// NOEL: tuyet roi + day den quanh man hinh + day den treo (khung ngang)
(() => {
  const PNG = new URLSearchParams(location.search).has('png');
  const ui = document.getElementById('ui'), tuyet = document.getElementById('tuyet'), kv = document.getElementById('kv');
  const W = parseFloat(kv.style.width) || kv.offsetWidth, H = kv.offsetHeight;
  let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  // Tuyet
  for (let i = 0; i < 70; i++) {
    const e = document.createElement('div'); e.className = 'bt';
    const kt = 3 + rnd() * 6;
    e.style.cssText = 'left:' + (rnd() * W).toFixed(0) + 'px;width:' + kt.toFixed(1) + 'px;height:' + kt.toFixed(1) + 'px;--lech:' + ((rnd() - 0.4) * 160).toFixed(0) + 'px;--cao:' + (H + 40) + 'px;animation-duration:' + (9 + rnd() * 12).toFixed(1) + 's;animation-delay:-' + (rnd() * 20).toFixed(1) + 's;filter:blur(' + (kt > 6 ? 0.8 : 0.2) + 'px)';
    if (PNG) { e.style.top = (rnd() * H).toFixed(0) + 'px'; }
    tuyet.appendChild(e);
  }
  // Day den quanh man hinh chinh (hinh chu nhat cua vien dau tien)
  const v = ui.querySelector('.vien');
  const L = parseFloat(v.style.left), T = parseFloat(v.style.top), Wd = parseFloat(v.style.width), Hd = parseFloat(v.style.height);
  const MAU = ['#FF3B3B', '#FFD166', '#3DDC84', '#FFFFFF', '#4FC3F7'];
  let k = 0;
  const den = (x, y) => { const e = document.createElement('div'); e.className = 'den'; e.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;--c:' + MAU[k % MAU.length] + ';animation-delay:-' + ((k * 0.37) % 1.5).toFixed(2) + 's'; k++; tuyet.appendChild(e); };
  const buoc = 36, le = 26, ra = 2;
  for (let x = L + le; x <= L + Wd - le; x += buoc) { den(x, T - ra); }
  for (let y = T + le; y <= T + Hd - le; y += buoc) { den(L + Wd + ra, y); }
  for (let x = L + Wd - le; x >= L + le; x -= buoc) { den(x, T + Hd + ra); }
  for (let y = T + Hd - le; y >= T + le; y -= buoc) { den(L - ra, y); }
  den(L + 6, T + 6); den(L + Wd - 6, T + 6); den(L + 6, T + Hd - 6); den(L + Wd - 6, T + Hd - 6);
  // Day den treo duoi cung (chi khung ngang: con vung trong 1044-1080)
  if (document.querySelector('.duoi .ticker')) {
    const y0 = 1050, kc = 120; let d = 'M0 ' + y0, bong = '';
    for (let x = 0, i = 0; x < W; x += kc, i++) {
      d += ' Q' + (x + kc / 2) + ' ' + (y0 + 20) + ' ' + (x + kc) + ' ' + y0;
      for (let j = 0; j < 3; j++) {
        const t = (j + 0.5) / 3, bx = x + kc * t, by = y0 + 2 * 20 * t * (1 - t) * 1.0 + 1;
        const c = MAU[(i * 3 + j) % MAU.length];
        bong += '<g style="color:' + c + '"><rect x="' + (bx - 2.5) + '" y="' + (by - 1) + '" width="5" height="6" rx="1" fill="#2d5a3d"/><ellipse class="gb" cx="' + bx + '" cy="' + (by + 11) + '" rx="5" ry="7" fill="' + c + '" style="animation-delay:-' + (((i * 3 + j) * 0.31) % 1.6).toFixed(2) + 's"/></g>';
      }
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'day-den'); svg.setAttribute('width', W); svg.setAttribute('height', 36); svg.style.top = '1044px'; svg.setAttribute('viewBox', '0 ' + 1044 + ' ' + W + ' 36');
    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#2d5a3d" stroke-width="2.5"/>' + bong;
    ui.appendChild(svg);
  }
})();
</script>
